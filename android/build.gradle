buildscript {
  ext.safeExtGet = {prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace 'com.margelo.nitro.pdfwriter'
  compileSdk safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
    // HEIC/WebP transcode tests run on a device/emulator (androidTest).
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    // The JNI bridge resolves these Kotlin classes by name; without consumer
    // rules a release build with R8 strips them and transcoding silently stops.
    consumerProguardFiles "consumer-rules.pro"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  buildFeatures {
    buildConfig false
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  externalNativeBuild {
    cmake {
      path file("CMakeLists.txt")
    }
  }

  packagingOptions {
    // CMake also drops the prefab-provided shared libs next to our JNI libs,
    // and react-android ships its own copies; the androidTest APK merges both
    // and reports a duplicate. Keep whichever comes first.
    pickFirst "**/libc++_shared.so"
    pickFirst "**/libfbjni.so"
    pickFirst "**/libjsi.so"
    pickFirst "**/libreactnative.so"
    pickFirst "**/libNitroModules.so"
  }
}

dependencies {
  implementation "com.facebook.react:react-native:+"
  implementation project(':react-native-nitro-modules')

  // Pure JVM tests for ImageTranscodePolicy (API gating, subsampling, sizing).
  testImplementation "junit:junit:4.13.2"

  // On-device tests for the actual HEIC/WebP decoding.
  androidTestImplementation "junit:junit:4.13.2"
  androidTestImplementation "androidx.test:runner:1.6.2"
  androidTestImplementation "androidx.test:core:1.6.1"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
}

apply from: "../nitrogen/generated/android/NitroPdfWriter+autolinking.gradle"
